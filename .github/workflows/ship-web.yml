name: Ship web to exo-skeleton.org

# Builds the browser target and deploys dist/ to the Cloudflare Pages project
# that serves exo-skeleton.org. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  (Pages: Edit)
#   CLOUDFLARE_ACCOUNT_ID
# Local equivalent: `npm run ship:web` (uses your own wrangler login).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship-web
  cancel-in-progress: true

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=exo-skeleton-org --branch=main
