[package]
name = "exoskeleton"
version = "0.1.0"
description = "Exoskeleton — integrated workspace (terminal, web viewport, markdown editor)"
authors = ["Harold Tajchman <halapenyoharry@gmail.com>"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "exoskeleton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-pty = "0.2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.10"
tokio = { version = "1.52.3", features = ["net", "sync", "rt", "macros"] }
